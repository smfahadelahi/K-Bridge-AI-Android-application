name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install latest stable Android SDK
        run: |
          set -euo pipefail
          packages="$(sdkmanager --list --channel=0 2>/dev/null || sdkmanager --list 2>/dev/null || true)"
          platform="$(printf '%s\n' "$packages" | grep -Eo 'platforms;android-[0-9]+' | sed 's/.*android-//' | sort -nu | tail -n 1 || true)"
          build_tools="$(printf '%s\n' "$packages" | grep -Eo 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' | sed 's/.*;//' | sort -V | tail -n 1 || true)"
          platform="${platform:-36}"
          build_tools="${build_tools:-36.0.0}"
          echo "Installing Android API $platform and Build Tools $build_tools."
          sdkmanager "platform-tools" "platforms;android-$platform" "build-tools;$build_tools"
          printf 'ANDROID_COMPILE_SDK=%s\nANDROID_TARGET_SDK=%s\n' "$platform" "$platform" >> "$GITHUB_ENV"

      - name: Run Kotlin checks, unit tests, lint, and debug build
        run: >-
          ./gradlew --no-daemon --stacktrace
          :core:domain:ktlintCheck
          :app:ktlintCheck
          :core:domain:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug

      - name: Run Compose UI tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kbridge-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'KBRIDGE_RELEASE_STORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          KBRIDGE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KBRIDGE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KBRIDGE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Upload signed release artifacts
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
