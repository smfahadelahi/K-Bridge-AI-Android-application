name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Select latest stable Android SDK on the runner
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          platform="$(find "$sdk_root/platforms" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sed -nE 's/^android-([0-9]+)$/\1/p' | sort -nu | tail -n 1)"
          if [ -z "$platform" ]; then
            echo "::error::No stable Android SDK platform is installed on the runner."
            exit 1
          fi
          echo "Using installed Android API $platform."
          printf 'ANDROID_COMPILE_SDK=%s\nANDROID_TARGET_SDK=%s\n' "$platform" "$platform" >> "$GITHUB_ENV"

      - name: Run Kotlin checks, unit tests, lint, and debug build
        id: gradle_checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            :core:domain:ktlintCheck \
            :app:ktlintCheck \
            :core:domain:test \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle failure details
        if: ${{ failure() && steps.gradle_checks.outcome == 'failure' }}
        shell: bash
        run: |
          ktlint_reports="$(find . -path '*/build/reports/ktlint/*Check.txt' -type f -print -exec cat {} \; 2>/dev/null || true)"
          if [ -n "$ktlint_reports" ]; then
            summary="$ktlint_reports"
          else
            summary="$(grep -E -A 8 'FAILURE:|\* What went wrong:|^e: | FAILED$|^Could not |^Plugin \[id:' \
              "$RUNNER_TEMP/gradle-build.log" | tail -n 45 || true)"
          fi
          if [ -z "$summary" ]; then
            summary="$(tail -n 35 "$RUNNER_TEMP/gradle-build.log")"
          fi
          tail_text="$(printf '%s' "$summary" | tr '\n' ' ' | cut -c1-7000)"
          echo "::error title=Gradle build failure summary::$tail_text"
          {
            echo "### Gradle build failure summary"
            printf '%s\n' "$summary"
            echo "### Gradle build log tail"
            tail -n 30 "$RUNNER_TEMP/gradle-build.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle log on failure
        if: ${{ failure() && steps.gradle_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-build-failure-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: error

      - name: Run Compose UI tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kbridge-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'KBRIDGE_RELEASE_STORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          KBRIDGE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KBRIDGE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KBRIDGE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Upload signed release artifacts
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
