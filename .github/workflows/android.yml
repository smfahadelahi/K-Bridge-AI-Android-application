name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_debug_preview:
        description: Publish an installable, debug-signed APK prerelease after verification
        required: true
        type: boolean
        default: false
      release_tag:
        description: Optional GitHub Release tag (for example v0.1.0-preview.1)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Select latest stable Android SDK on the runner
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          platform="$(find "$sdk_root/platforms" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sed -nE 's/^android-([0-9]+)$/\1/p' | sort -nu | tail -n 1)"
          if [ -z "$platform" ]; then
            echo "::error::No stable Android SDK platform is installed on the runner."
            exit 1
          fi
          echo "Using installed Android API $platform."
          printf 'ANDROID_COMPILE_SDK=%s\nANDROID_TARGET_SDK=%s\n' "$platform" "$platform" >> "$GITHUB_ENV"

      - name: Run Kotlin checks, unit tests, lint, and debug build
        id: gradle_checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            :core:domain:ktlintCheck \
            :app:ktlintCheck \
            :core:domain:test \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle failure details
        if: ${{ failure() && steps.gradle_checks.outcome == 'failure' }}
        shell: bash
        run: |
          ktlint_reports="$(find . -path '*/build/reports/ktlint/*Check.txt' -type f -size +0c -print -exec cat {} \; 2>/dev/null || true)"
          if [ -n "$ktlint_reports" ]; then
            summary="$ktlint_reports"
          else
            summary="$(grep -E -A 8 'FAILURE:|\* What went wrong:|^e: | FAILED$|^Could not |^Plugin \[id:' \
              "$RUNNER_TEMP/gradle-build.log" | tail -n 45 || true)"
          fi
          if [ -z "$summary" ]; then
            summary="$(tail -n 35 "$RUNNER_TEMP/gradle-build.log")"
          fi
          tail_text="$(printf '%s' "$summary" | tr '\n' ' ' | cut -c1-7000)"
          echo "::error title=Gradle build failure summary::$tail_text"
          {
            echo "### Gradle build failure summary"
            printf '%s\n' "$summary"
            echo "### Gradle build log tail"
            tail -n 30 "$RUNNER_TEMP/gradle-build.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle log on failure
        if: ${{ failure() && steps.gradle_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-build-failure-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check emulator host acceleration
        id: emulator_host
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator host::KVM hardware acceleration is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Emulator host::KVM is unavailable; Android instrumentation tests were compiled but will not execute on this runner."
          fi

      - name: Run Compose UI tests on Android 12 (minimum API)
        if: ${{ steps.emulator_host.outputs.available == 'true' }}
        id: compose_tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -o pipefail
            ./gradlew --no-daemon --stacktrace --console=plain connectedDebugAndroidTest 2>&1 \
              | tee "$RUNNER_TEMP/compose-ui-test.log"

      - name: Surface Compose UI test failure details
        if: ${{ failure() && steps.compose_tests.outcome == 'failure' }}
        shell: bash
        run: |
          test_log="$RUNNER_TEMP/compose-ui-test.log"
          if [ -s "$test_log" ]; then
            summary="$(grep -E -A 8 'FAILURE:|\* What went wrong:|^e: |FAILED$|failed|Failed|Tests run:|INSTRUMENTATION_STATUS|No tests found' \
              "$test_log" | tail -n 80 || true)"
            if [ -z "$summary" ]; then
              summary="$(tail -n 80 "$test_log")"
            fi
          else
            summary="The emulator failed before the test script started; no Gradle test log was produced."
          fi
          tail_text="$(printf '%s' "$summary" | tr '\n' ' ' | cut -c1-7000)"
          echo "::error title=Compose UI test failure summary::$tail_text"
          {
            echo "### Compose UI test failure summary"
            printf '%s\n' "$summary"
            echo "### Compose UI test log tail"
            if [ -s "$test_log" ]; then
              tail -n 50 "$test_log"
            else
              echo "No Gradle test log was created because the emulator did not boot."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kbridge-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'KBRIDGE_RELEASE_STORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          KBRIDGE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KBRIDGE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KBRIDGE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Upload signed release artifacts
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k-bridge-ai-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  publish_preview:
    name: Publish debug-signed APK prerelease
    needs: verify
    if: >-
      ${{
        needs.verify.result == 'success' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.publish_debug_preview == true) ||
          (github.event_name == 'push' &&
            github.ref == 'refs/heads/arena/f79c0bd4-k-bridge-ai-android-applicatio' &&
            contains(github.event.head_commit.message, '[publish-preview]'))
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Select latest stable Android SDK on the runner
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          platform="$(find "$sdk_root/platforms" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sed -nE 's/^android-([0-9]+)$/\1/p' | sort -nu | tail -n 1)"
          if [ -z "$platform" ]; then
            echo "::error::No stable Android SDK platform is installed on the runner."
            exit 1
          fi
          printf 'ANDROID_COMPILE_SDK=%s\nANDROID_TARGET_SDK=%s\n' "$platform" "$platform" >> "$GITHUB_ENV"

      - name: Build installable debug APK
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          build_tools="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$build_tools"
          "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/$build_tools/apksigner" verify --verbose "$apk"
          "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/$build_tools/aapt" dump badging "$apk" \
            | grep -F "package: name='com.kbridge.ai'"

      - name: Publish APK as a prerelease asset
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-v0.1.0-preview.${GITHUB_RUN_NUMBER}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].-]+)?$ ]]; then
            echo "::error::Release tag must follow vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; choose a new tag."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Installable debug-signed preview APK for K-Bridge AI.

          **Signing:** this APK uses the Android debug key; it is not production-signed and cannot receive updates signed with a future production key.

          **Available:** offline starter phrasebook, locally saved phrases and quizzes, and typed Korean↔Bangla translation after the user approves downloading ML Kit models over Wi-Fi.

          **Not yet implemented:** speech recognition, camera OCR, generated AI replies, and text-to-speech. ML Kit model download requires Google Play services and an Internet connection. Translation quality is not guaranteed.
          NOTES
          apk="app/build/outputs/apk/debug/app-debug.apk"
          asset_name="K-Bridge-AI-${tag}-debug.apk"
          gh release create "$tag" "$apk#$asset_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "K-Bridge AI ${tag#v} (debug preview)" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url, assets: [.assets[].name]}'
